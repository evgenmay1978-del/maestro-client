# Maestro Client — CI: сборка debug-APK на GitHub Actions.
#
# Локальная сборка на VM РАБОТАЕТ (доказано в срезе 2), но требует:
#   JAVA_TOOL_OPTIONS="-Djava.net.preferIPv4Stack=true" (иначе Java ходит
#     через IPv6 dual-stack сокет и получает Connection reset на egress-прокси),
#   свежий пароль egress-прокси в ~/.gradle/gradle.properties и в -D*-proxyPassword
#     того же вызова (пароль ротируется между вызовами),
#   GRADLE_OPTS с тем же флагом + trustStore egress-CA.
# Без этих трёх условий Gradle падает на разрешении плагинов/зависимостей.
# Локальная сборка — для проверки; эталонная — здесь, в CI.
#
# Срез 7 (issue #8): job libbox удалён вместе с sing-box. NDK нужен только
# для JNI-лаунчера (ndk-build, src/main/cpp); Xray-бинарь — готовый .so
# в app/src/main/jniLibs.
name: Build Maestro Client (debug)

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  app:
    name: Build debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # NDK — для ndk-build (JNI-лаунчер xrayspawn). CMake не нужен.
      - name: Install Android NDK 28.0.13004108
        run: |
          set -euo pipefail
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME}}"
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$SDK/cmdline-tools/latest/bin/sdkmanager" "ndk;28.0.13004108" "platform-tools" >/dev/null
          echo "ANDROID_NDK_HOME=${SDK}/ndk/28.0.13004108" >> "$GITHUB_ENV"

      - name: Build debug APK
        run: ./gradlew assembleDebug --console=plain --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: maestro-client-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
